<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dollar to Peso Calculator</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#111;min-height:100vh;display:grid;place-items:center;padding:18px}
  .card{width:min(100%,430px);background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
  h1{font-size:28px;text-align:center;margin:0 0 8px} .sub{text-align:center;color:#555;margin:0 0 20px}
  label{display:block;font-weight:700;margin:14px 0 7px} input,select,button{width:100%;font-size:22px;border-radius:14px;padding:15px;border:2px solid #d9dde3;background:#fff}
  input:focus,select:focus{outline:3px solid #b9d7ff;border-color:#2684ff}
  button{margin-top:16px;border:0;background:#1677ff;color:#fff;font-weight:800;cursor:pointer} button:active{transform:scale(.99)}
  .result{margin-top:18px;padding:18px;border-radius:16px;background:#eef6ff;text-align:center;display:none}
  .result strong{display:block;font-size:34px;margin-top:6px}.joke{margin-top:12px;font-size:22px;font-weight:900}
  .rate{font-size:16px}.small{text-align:center;color:#666;font-size:14px;margin-top:15px}
</style>
</head>
<body>
<main class="card">
  <h1>Dollar ↔ Peso</h1>
  <p class="sub">Fast and simple</p>

  <label for="direction">Convert</label>
  <select id="direction">
    <option value="usd-mxn">U.S. dollars to Mexican pesos</option>
    <option value="mxn-usd">Mexican pesos to U.S. dollars</option>
  </select>

  <label for="amount">Amount</label>
  <input id="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="Enter amount">

  <label for="rate">Exchange rate</label>
  <input id="rate" type="number" inputmode="decimal" min="0.01" step="0.01" value="18">

  <button id="convert">Convert</button>

  <section class="result" id="result" aria-live="polite">
    <span id="resultLabel">Result</span>
    <strong id="resultValue"></strong>
    <div class="joke">YOU IS DUMB</div>
  </section>

  <p class="small">Default estimate: 1 USD = 18 MXN. Change the rate anytime.</p>
</main>
<script>
const amount=document.getElementById('amount');
const rate=document.getElementById('rate');
const direction=document.getElementById('direction');
const result=document.getElementById('result');
const resultValue=document.getElementById('resultValue');
const resultLabel=document.getElementById('resultLabel');

function convert(){
  const a=Number(amount.value), r=Number(rate.value);
  if(!Number.isFinite(a)||a<0||!Number.isFinite(r)||r<=0){
    alert('Enter a valid amount and exchange rate.'); return;
  }
  if(direction.value==='usd-mxn'){
    resultLabel.textContent=`$${a.toLocaleString(undefined,{maximumFractionDigits:2})} USD equals about`;
    resultValue.textContent=`${(a*r).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} MXN`;
  }else{
    resultLabel.textContent=`${a.toLocaleString(undefined,{maximumFractionDigits:2})} MXN equals about`;
    resultValue.textContent=`$${(a/r).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} USD`;
  }
  result.style.display='block';
}

document.getElementById('convert').addEventListener('click',convert);
amount.addEventListener('keydown',e=>{if(e.key==='Enter')convert()});
direction.addEventListener('change',()=>{result.style.display='none';amount.focus()});
</script>
</body>
</html>
